<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana María & Francisco — 31.10.2026</title>
<meta name="description" content="Invitación de boda de Ana María y Francisco · 31 de octubre de 2026">
<style>
/* Importación de tipografías */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

:root{
  --sage:#a9bdb2;
  --sage-dark:#66867a;
  --paper:#faf9f5;
  --gold:#b39155;
  --ink:#4d514d;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

body{
  background:
    radial-gradient(circle at 12% 18%, rgba(190,211,201,.2), transparent 28%),
    radial-gradient(circle at 88% 80%, rgba(190,211,201,.2), transparent 30%),
    #e9efed;
  overflow-x:hidden;
}

.page{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px 14px;
  position:relative;
  overflow:hidden;
}

.botanical{position:absolute;opacity:.5;pointer-events:none;transition:opacity .3s ease}
.botanical.top{top:-30px;left:-45px;transform:rotate(-5deg)}
.botanical.bottom{right:-60px;bottom:-45px;transform:rotate(175deg)}
.leaf{fill:#80a294}

.invitation{
  width:min(100%, 520px);
  min-height:760px;
  position:relative;
  border-radius:2px;
  background:#fff;
  box-shadow:0 15px 45px rgba(62,78,69,.1);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.envelope-screen{
  position:absolute;
  inset:0;
  z-index:10;
  background:
    radial-gradient(circle at 20% 10%, rgba(218,231,224,.5), transparent 30%),
    radial-gradient(circle at 90% 85%, rgba(211,226,218,.6), transparent 32%),
    #fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:35px;
  transition:opacity .8s ease, visibility .8s ease;
}

.envelope-screen.opened{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.envelope-wrap{
  width:min(90%,400px);
  aspect-ratio:1.45;
  position:relative;
  perspective:1000px;
  touch-action:pan-y;
  cursor:pointer;
}

.envelope{
  position:absolute;
  inset:0;
  background:#c2d1ca;
  border-radius:3px;
  box-shadow:0 10px 25px rgba(55,72,64,.12);
  overflow:visible;
}

.envelope:before,
.envelope:after{
  content:"";
  position:absolute;
  bottom:0;
  width:0;height:0;
  border-style:solid;
  z-index:3;
}

.envelope:before{
  left:0;
  border-width:0 0 100% 50%;
  border-color:transparent transparent #b3c6bd transparent;
}

.envelope:after{
  right:0;
  border-width:0 50% 100% 0;
  border-color:transparent #adbeb6 transparent transparent;
}

.flap{
  position:absolute;
  top:0;left:0;
  width:100%;height:64%;
  background:#cbd9d2;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.2,.75,.2,1);
  z-index:5;
  filter:drop-shadow(0 2px 2px rgba(50,70,60,.05));
}

/* --- SELLO Y CENTRADO DE "A y F" --- */
.seal{
  position:absolute;
  z-index:6;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:68px;height:68px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d8c28a, #ab8d52);
  box-shadow:0 3px 9px rgba(74,58,31,.2);
  display:flex;
  justify-content:center;
  align-items:center;
  transition:transform .6s ease, opacity .35s ease;
}

.seal span{
  border:1px solid rgba(255,255,255,.55);
  width:50px;height:50px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#ffffff;
  font-family:"Cormorant Garamond", serif;
  font-size:19px;
  font-weight:500;
  letter-spacing:0.02em;
  text-align:center;
  line-height:1;
  padding-top:1px; /* Ajuste óptico vertical */
  white-space:nowrap;
}

.envelope-screen.opening .flap{transform:rotateX(180deg)}
.envelope-screen.opening .seal{transform:translate(-50%,-50%) scale(.8);opacity:0}
.envelope-screen.opening .envelope{animation:lift .9s ease forwards}

@keyframes lift{
  50%{transform:translateY(-15px) scale(1.01)}
  100%{transform:translateY(-30px) scale(.98);opacity:0}
}

.instruction{
  margin-top:55px;
  text-align:center;
  color:var(--gold);
  letter-spacing:.3em;
  font-size:13px;
  font-weight:500;
  text-transform:uppercase;
}

.arrow{
  width:16px;height:16px;
  border-right:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
  transform:rotate(45deg);
  margin:16px auto 0;
  animation:bounce 1.5s infinite;
}
@keyframes bounce{50%{transform:rotate(45deg) translate(4px,4px)}}

.content{
  min-height:100svh;
  padding:75px 40px 60px;
  text-align:center;
  position:relative;
  background:
    radial-gradient(circle at 10% 25%, rgba(194,218,207,.2), transparent 30%),
    radial-gradient(circle at 95% 75%, rgba(194,218,207,.2), transparent 30%);
}

.content:before{
  content:"";
  position:absolute;
  top:-15px;right:-20px;
  width:180px;height:180px;
  background:
    radial-gradient(ellipse at 20% 50%, #a4bdb2 0 5%, transparent 6%),
    radial-gradient(ellipse at 35% 35%, #8ba699 0 5%, transparent 6%),
    radial-gradient(ellipse at 50% 20%, #aec2b9 0 6%, transparent 7%);
  opacity:.2;
  transform:rotate(20deg);
  filter:blur(.1px);
}

.kicker{
  font-size:12px;
  letter-spacing:.35em;
  margin-bottom:28px;
  color:var(--sage-dark);
}
.names{
  font-family:"Cormorant Garamond",serif;
  color:var(--gold);
  font-size:clamp(46px,11vw,68px);
  line-height:.8;
  letter-spacing:.06em;
  font-weight:500;
}
.and{
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  color:var(--gold);
  margin:20px 0;
}
.surnames{
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  letter-spacing:.2em;
  margin-top:12px;
}
.date{
  margin:40px 0 35px;
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  letter-spacing:.15em;
}
.line{width:70px;height:1px;background:var(--gold);margin:0 auto 38px}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px 20px;
  margin-top:10px;
}
.detail h3{
  margin:0 0 11px;
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:.12em;
  font-weight:500;
}
.detail p{
  margin:0;
  font-size:11.5px;
  line-height:1.7;
  letter-spacing:.04em;
}
.place{grid-column:1/-1}

.footer-leaves{
  margin:45px auto 0;
  width:140px;
  height:35px;
  position:relative;
}
.footer-leaves:before,.footer-leaves:after{
  content:"";
  position:absolute;
  top:16px;
  width:68px;height:1px;
  background:var(--sage-dark);
  opacity:.7;
}
.footer-leaves:before{left:0;transform:rotate(-16deg)}
.footer-leaves:after{right:0;transform:rotate(16deg)}
.heart{color:var(--gold);font-size:16px;position:relative;z-index:1;background:#fff;padding:0 8px}

@media(max-width:480px){
  .page{padding:0}
  .invitation{border-radius:0;min-height:100svh;box-shadow:none}
  .envelope-screen{min-height:100svh;padding:25px}
  .content{padding:68px 25px 48px}
  .details{gap:25px 12px}
  .names{font-size:50px}
  .botanical{opacity:0.3}
}
</style>
</head>
<body>

<main class="page">

  <svg class="botanical top" width="310" height="260" viewBox="0 0 310 260" aria-hidden="true">
    <path class="leaf" d="M30 210 C90 120 140 75 275 25 C180 105 120 170 30 210Z"/>
    <ellipse class="leaf" cx="87" cy="157" rx="18" ry="52" transform="rotate(42 87 157)"/>
    <ellipse class="leaf" cx="121" cy="121" rx="17" ry="49" transform="rotate(48 121 121)"/>
    <ellipse class="leaf" cx="157" cy="94" rx="15" ry="45" transform="rotate(57 157 94)"/>
    <ellipse class="leaf" cx="199" cy="65" rx="14" ry="42" transform="rotate(65 199 65)"/>
    <ellipse class="leaf" cx="70" cy="184" rx="14" ry="42" transform="rotate(-38 70 184)"/>
  </svg>

  <svg class="botanical bottom" width="330" height="280" viewBox="0 0 330 280" aria-hidden="true">
    <path class="leaf" d="M20 225 C90 120 160 70 310 35 C205 115 135 185 20 225Z"/>
    <ellipse class="leaf" cx="100" cy="160" rx="17" ry="52" transform="rotate(35 100 160)"/>
    <ellipse class="leaf" cx="143" cy="126" rx="16" ry="47" transform="rotate(48 143 126)"/>
    <ellipse class="leaf" cx="185" cy="97" rx="15" ry="43" transform="rotate(58 185 97)"/>
  </svg>

  <section class="invitation">

    <div class="envelope-screen" id="envelopeScreen">
      <div class="envelope-wrap" id="envelopeWrap" aria-label="Tocar el sobre para abrir la invitación">
        <div class="envelope">
          <div class="flap"></div>
          <div class="seal"><span>A y F</span></div>
        </div>
      </div>

      <div class="instruction">toca el sobre</div>
      <div class="arrow"></div>
    </div>

    <section class="content">
      <div class="kicker">NOS CASAMOS</div>

      <div class="names">ANA MARÍA</div>
      <div class="surnames">BARRIO BERROCAL</div>

      <div class="and">Y</div>

      <div class="names">FRANCISCO</div>
      <div class="surnames">SENDRA MÁRQUEZ</div>

      <div class="date">31 · 10 · 2026</div>
      <div class="line"></div>

      <div class="details">
        <div class="detail">
          <h3>LLEGADA</h3>
          <p>13.00 h</p>
        </div>

        <div class="detail">
          <h3>CEREMONIA</h3>
          <p>13.30 h</p>
        </div>

        <div class="detail place">
          <h3>LUGAR</h3>
          <p>
            Club de Tenis y Padel Lew Hoad<br>
            Ctra. Mijas-Fuengirola, km 3.5<br>
            29650 Mijas, Málaga
          </p>
        </div>
      </div>

      <div class="footer-leaves"><span class="heart">♡</span></div>
    </section>
  </section>
</main>

<script>
const screen = document.getElementById('envelopeScreen');
const wrap = document.getElementById('envelopeWrap');
let opened = false;

function openInvitation(){
  if(opened) return;
  opened = true;
  screen.classList.add('opening');
  setTimeout(() => screen.classList.add('opened'), 850); 
}

wrap.addEventListener('click', openInvitation);
</script>

</body>
</html>
