<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sobre Interactivo</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Contenedor del sobre con perspectiva 3D */
  .envelope-wrapper {
    width: min(100%, 480px);
    height: 100svh;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
  }

  .envelope-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  /* Base 1: Fondo interior (lo que se ve cuando la solapa sube) */
  .bg-inside {
    z-index: 1;
  }

  /* Base 2: Cuerpo inferior del sobre en JPG */
  .envelope-body {
    z-index: 2;
  }

  /* Capa Móvil: Solapa superior + Sello en PNG transparente */
  .envelope-flap {
    z-index: 3;
    transform-origin: top center; /* La bisagra gira desde el borde superior */
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Texto indicativo */
  .tap-instruction {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffffff;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    z-index: 10;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* ANIMACIÓN AL HACER CLIC: La solapa gira 180° hacia arriba */
  .envelope-wrapper.is-open .envelope-flap {
    transform: rotateX(180deg);
  }

  .envelope-wrapper.is-open .tap-instruction {
    opacity: 0;
  }
</style>
</head>
<body>

  <div class="envelope-wrapper" id="envelope">
    <!-- 1. Fondo interior descubierto -->
    <img src="sobre_abierto.jpg" alt="Interior" class="envelope-layer bg-inside">

    <!-- 2. Cuerpo del sobre (JPG) -->
    <img src="cuerpo_sobre.jpg" alt="Cuerpo" class="envelope-layer envelope-body">

    <!-- 3. Solapa + Sello móvil (PNG con fondo transparente) -->
    <img src="solapa_sello.png" alt="Solapa y Sello" class="envelope-layer envelope-flap">

    <div class="tap-instruction">Toca para abrir</div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    
    envelope.addEventListener('click', () => {
      envelope.classList.add('is-open');
    });
  </script>

</body>
</html>
