<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sobre</title>
<style>
  * {
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .envelope-container {
    width: min(100%, 480px);
    height: 100svh;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  /* Imagen de fondo: Sobre Abierto */
  .envelope-open {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 1;
  }

  /* Imagen superior: Sobre Cerrado */
  .envelope-closed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 2;
    transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
  }

  /* Texto indicativo */
  .tap-instruction {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffffff;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    z-index: 3;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* Clase que desvanece el sobre cerrado al hacer clic */
  .envelope-container.is-open .envelope-closed {
    opacity: 0;
    transform: scale(1.03);
    pointer-events: none;
  }

  .envelope-container.is-open .tap-instruction {
    opacity: 0;
  }
</style>
</head>
<body>

  <div class="envelope-container" id="envelope">
    <!-- Capa 1: Fondo (Sobre Abierto) -->
    <img src="sobre_abierto.jpg" alt="Sobre Abierto" class="envelope-open">
    
    <!-- Capa 2: Arriba (Sobre Cerrado) -->
    <img src="sobre_cerrado.jpg" alt="Sobre Cerrado" class="envelope-closed">

    <div class="tap-instruction">Toca para abrir</div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    
    envelope.addEventListener('click', () => {
      envelope.classList.add('is-open');
    });
  </script>

</body>
</html>
