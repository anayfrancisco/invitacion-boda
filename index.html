<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sobre 3D</title>
<style>
  * {
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Contenedor del sobre con perspectiva 3D */
  .envelope-container {
    width: min(100%, 480px);
    height: 100svh;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    perspective: 1200px; /* Sensación de profundidad 3D */
  }

  /* Capa de fondo: El sobre abierto en la base */
  .envelope-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 1;
  }

  /* Capa intermedia: El cuerpo inferior y lateral del sobre cerrado */
  .envelope-body {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 2;
    /* Muestra únicamente la mitad inferior del sobre cerrado */
    clip-path: polygon(0 35%, 100% 35%, 100% 100%, 0 100%);
  }

  /* Capa superior: La solapa que se dobla/gira */
  .envelope-flap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 3;
    /* Recorta la solapa triangular superior */
    clip-path: polygon(0 0, 100% 0, 50% 50%);
    /* Establece el punto de rotación en el borde superior de la pantalla */
    transform-origin: top center;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  /* Texto indicativo */
  .tap-instruction {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffffff;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    z-index: 10;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* ANIMACIÓN AL HACER CLIC: La solapa gira 180° hacia arriba */
  .envelope-container.is-open .envelope-flap {
    transform: rotateX(180deg);
  }

  .envelope-container.is-open .tap-instruction {
    opacity: 0;
  }
</style>
</head>
<body>

  <div class="envelope-container" id="envelope">
    <!-- 1. Fondo de sobre abierto -->
    <img src="sobre_abierto.jpg" alt="Fondo" class="envelope-bg">

    <!-- 2. Cuerpo del sobre cerrado (Lados y parte inferior) -->
    <img src="sobre_cerrado.jpg" alt="Cuerpo" class="envelope-body">

    <!-- 3. Solapa móvil (Rotación 3D) -->
    <img src="sobre_cerrado.jpg" alt="Solapa" class="envelope-flap">

    <div class="tap-instruction">Toca para abrir</div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    
    envelope.addEventListener('click', () => {
      envelope.classList.add('is-open');
    });
  </script>

</body>
</html>
