<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana y Francisco - 31.10.2026</title>
<meta name="description" content="Invitación de boda de Ana María y Francisco · 31 de octubre de 2026">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap');

:root{
  --gold:#b39155;
  --gold-hover:#96763d;
  --ink:#4a524d;
  
  /* Tu imagen configurada como fondo */
  --bg-image: url('9469116_4152950.jpg'); 
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}

body{
  background:#e3e8e5;
  overflow-x:hidden;
}

.page{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 10px;
  position:relative;
}

.invitation{
  width:min(100%, 480px);
  min-height:720px;
  position:relative;
  border-radius:4px;
  background:#ffffff;
  box-shadow:0 20px 50px rgba(45,60,53,.12);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* PANTALLA DEL SOBRE */
.envelope-screen{
  position:absolute;
  inset:0;
  z-index:10;
  background:#f6f8f7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:opacity .8s ease, visibility .8s ease;
}

.envelope-screen.opened{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* TEXTO ENCIMA DEL SOBRE (Mismo estilo que la instrucción) */
.envelope-title{
  margin-bottom:40px;
  text-align:center;
  color:var(--gold);
  letter-spacing:.25em;
  font-size:12px;
  font-weight:500;
  text-transform:uppercase;
  padding:0 10px;
}

.envelope-wrap{
  width:min(92%,380px);
  aspect-ratio:1.45;
  position:relative;
  perspective:1000px;
  touch-action:pan-y;
  cursor:pointer;
}

.envelope{
  position:absolute;
  inset:0;
  background:#9db1a7;
  border-radius:3px;
  box-shadow:0 12px 30px rgba(45,60,54,.2);
  overflow:visible;
}

.envelope:before,
.envelope:after{
  content:"";
  position:absolute;
  bottom:0;
  width:0;height:0;
  border-style:solid;
  z-index:3;
}

.envelope:before{
  left:0;
  border-width:0 0 100% 50%;
  border-color:transparent transparent #8fa399 transparent;
}

.envelope:after{
  right:0;
  border-width:0 50% 100% 0;
  border-color:transparent #879b91 transparent transparent;
}

.flap{
  position:absolute;
  top:0;left:0;
  width:100%;height:64%;
  background:#a8bbb1;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform 1s cubic-bezier(.2,.75,.2,1);
  z-index:5;
  filter:drop-shadow(0 3px 4px rgba(40,55,48,.12));
}

.seal{
  position:absolute;
  z-index:6;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:66px;height:66px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #d8c28a, #ab8d52);
  box-shadow:0 4px 14px rgba(40,30,15,.3);
  display:flex;
  justify-content:center;
  align-items:center;
  transition:transform .6s ease, opacity .35s ease;
}

.seal span{
  border:1px solid rgba(255,255,255,.6);
  width:48px;height:48px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#ffffff;
  font-family:"Cormorant Garamond", serif;
  font-size:18px;
  font-weight:500;
  letter-spacing:0.02em;
  text-align:center;
  line-height:1;
  padding-top:1px;
  white-space:nowrap;
}

.envelope-screen.opening .flap{transform:rotateX(180deg)}
.envelope-screen.opening .seal{transform:translate(-50%,-50%) scale(.8);opacity:0}
.envelope-screen.opening .envelope{animation:lift .9s ease forwards}

@keyframes lift{
  50%{transform:translateY(-15px) scale(1.01)}
  100%{transform:translateY(-30px) scale(.98);opacity:0}
}

.instruction{
  margin-top:40px;
  text-align:center;
  color:var(--gold);
  letter-spacing:.25em;
  font-size:12px;
  font-weight:500;
  text-transform:uppercase;
  padding:0 10px;
}

/* TARJETA INTERNA CON TU IMAGEN DE FONDO */
.content{
  min-height:100svh;
  padding:50px 30px;
  text-align:center;
  position:relative;
  background:#ffffff;
  
  background-image: var(--bg-image);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* Velo sutil */
.content::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255, 255, 255, 0.82);
  z-index:1;
}

.content > *{
  position:relative;
  z-index:2;
  width:100%;
}

.names{
  font-family:"Cormorant Garamond",serif;
  color:var(--gold);
  font-size:clamp(38px, 9vw, 54px);
  line-height:.9;
  letter-spacing:.08em;
  font-weight:500;
}

.and{
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  color:var(--gold);
  margin:16px 0;
  font-style:italic;
}

.surnames{
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  letter-spacing:.22em;
  margin-top:8px;
  color:var(--ink);
  opacity:.9;
}

.date{
  margin:32px 0 25px;
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  letter-spacing:.18em;
}

.line{width:60px;height:1px;background:var(--gold);margin:0 auto 28px;opacity:.7}

/* SECCIÓN DE DETALLES */
.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 15px;
  margin-top:10px;
}

.detail-icon{
  width:22px;
  height:22px;
  margin:0 auto 6px;
  display:block;
}

.detail-icon path,
.detail-icon circle{
  stroke:var(--gold);
  fill:none;
}

.detail h3{
  margin:0 0 6px;
  color:var(--gold);
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:.14em;
  font-weight:500;
}

.detail p{
  margin:0;
  font-size:11px;
  line-height:1.6;
  letter-spacing:.03em;
}

.place{grid-column:1/-1}

.btn-maps{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:14px;
  padding:8px 16px;
  border:1px solid var(--gold);
  border-radius:20px;
  color:var(--gold);
  text-decoration:none;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:all .25s ease;
  background: rgba(255,255,255,0.7);
}

.btn-maps svg{
  width:12px;
  height:12px;
  stroke:currentColor;
  fill:none;
}

.btn-maps:hover, .btn-maps:active{
  background:var(--gold);
  color:#ffffff;
}

.btn-maps:hover svg, .btn-maps:active svg{
  stroke:#ffffff;
}

@media(max-width:480px){
  .page{padding:0}
  .invitation{border-radius:0;min-height:100svh;box-shadow:none;width:100%}
  .envelope-screen{min-height:100svh;padding:15px}
  .content{padding:45px 20px}
  .names{font-size:38px}
  .surnames{font-size:16px}
  .date{font-size:22px;margin:24px 0 20px}
  .details{gap:18px 10px}
}
</style>
</head>
<body>

<main class="page">
  <section class="invitation">

    <!-- SOBRE DE BIENVENIDA -->
    <div class="envelope-screen" id="envelopeScreen">
      
      <div class="envelope-title">TE INVITAMOS A NUESTRA BODA</div>

      <div class="envelope-wrap" id="envelopeWrap" aria-label="Tocar el sobre para abrir la invitación">
        <div class="envelope">
          <div class="flap"></div>
          <div class="seal"><span>A y F</span></div>
        </div>
      </div>

      <div class="instruction">TOCA EL SOBRE PARA ABRIRLO</div>
    </div>

    <!-- TARJETA CON FONDO DE IMAGEN -->
    <section class="content">

      <div class="names">ANA MARÍA</div>
      <div class="surnames">BARRIO BERROCAL</div>

      <div class="and">y</div>

      <div class="names">FRANCISCO</div>
      <div class="surnames">SENDRA MÁRQUEZ</div>

      <div class="date">31 · 10 · 2026</div>
      <div class="line"></div>

      <div class="details">
        <div class="detail">
          <svg class="detail-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-width="1.3"/>
            <path d="M12 7v5l3 2" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <h3>LLEGADA</h3>
          <p>13.00 h</p>
        </div>

        <div class="detail">
          <svg class="detail-icon" viewBox="0 0 24 24">
            <circle cx="9" cy="13" r="5" stroke-width="1.3"/>
            <circle cx="15" cy="13" r="5" stroke-width="1.3"/>
            <path d="M8.5 7.5l1 1M15.5 7.5l-1 1" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <h3>CEREMONIA</h3>
          <p>13.30 h</p>
        </div>

        <div class="detail place">
          <svg class="detail-icon" viewBox="0 0 24 24">
            <path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z" stroke-width="1.3"/>
            <circle cx="12" cy="11" r="2" stroke-width="1.3"/>
          </svg>
          <h3>LUGAR</h3>
          <p>
            Club de Tenis y Padel Lew Hoad<br>
            Ctra. Mijas-Fuengirola, km 3.5<br>
            29650 Mijas, Málaga
          </p>
          
          <a href="https://maps.google.com/?q=Club+de+Tenis+y+Padel+Lew+Hoad+Mijas" target="_blank" rel="noopener noreferrer" class="btn-maps">
            <svg viewBox="0 0 24 24">
              <path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z" stroke-width="1.5"/>
              <circle cx="12" cy="11" r="2" stroke-width="1.5"/>
            </svg>
            Ver en Maps
          </a>
        </div>
      </div>

    </section>
  </section>
</main>

<script>
const screen = document.getElementById('envelopeScreen');
const wrap = document.getElementById('envelopeWrap');
let opened = false;

function openInvitation(){
  if(opened) return;
  opened = true;
  screen.classList.add('opening');
  setTimeout(() => screen.classList.add('opened'), 850); 
}

wrap.addEventListener('click', openInvitation);
</script>

</body>
</html>
